<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>이리신광교회 시설안내</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;800&display=swap">
<style>
:root{--ink:#1d2228;--sub:#6b7480;--mute:#9aa3ad;--line:#dfe3e8;--bg:#f6f7f9;--floor:#eceff2;--wall:#8a949f;--acc:#1F2F46;--acc2:#2f6fd6}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;font-family:Pretendard,'Noto Sans KR',system-ui,sans-serif;color:var(--ink);background:#fff;-webkit-font-smoothing:antialiased}
button{font:inherit;cursor:pointer}
.app{display:grid;grid-template-columns:1fr 380px;grid-template-rows:auto 1fr;height:100%;min-height:560px}
.embed .brand{display:none}.embed header{padding:14px 22px}
header{grid-column:1/-1;display:flex;align-items:center;gap:28px;padding:18px 28px;border-bottom:1px solid var(--line);background:#fff}
.brand{display:flex;flex-direction:column}
.brand small{font-size:11px;letter-spacing:2.5px;color:var(--mute);font-weight:700}
.brand b{font-size:20px;font-weight:800;letter-spacing:-.6px}
.floors{display:flex;gap:6px;background:var(--bg);padding:5px;border-radius:12px}
.floors button{border:0;background:none;min-width:58px;height:40px;border-radius:9px;font-weight:700;font-size:15px;color:var(--sub)}
.floors button.on{background:#fff;color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.search{margin-left:auto;position:relative;width:340px}
.search input{width:100%;height:44px;border:1px solid var(--line);border-radius:12px;padding:0 14px 0 42px;font:inherit;font-size:15px;background:#fff;outline:none}
.search input:focus{border-color:var(--ink)}
.search svg{position:absolute;left:14px;top:13px}
.results{position:absolute;top:50px;left:0;right:0;background:#fff;border:1px solid var(--line);border-radius:12px;box-shadow:0 14px 40px rgba(0,0,0,.12);max-height:360px;overflow:auto;display:none;z-index:20}
.results button{display:flex;align-items:center;gap:10px;width:100%;border:0;background:none;padding:12px 14px;text-align:left;border-bottom:1px solid #f1f3f5}
.results button:hover,.results button.k{background:var(--bg)}
.results .fl{min-width:34px;height:24px;border-radius:6px;background:var(--bg);font-size:12px;font-weight:800;color:var(--sub);display:grid;place-items:center}
.results .nm{font-size:14px;font-weight:600}.results .hint{font-size:12px;color:var(--mute);margin-left:auto}
/* map */
.stage{position:relative;background:var(--bg);overflow:hidden}
.ftitle{position:absolute;left:28px;top:22px;z-index:3}
.ftitle b{font-size:40px;font-weight:800;letter-spacing:-1.5px;line-height:1}
.ftitle span{display:block;font-size:13px;color:var(--sub);margin-top:6px}
svg#map{width:100%;height:100%;display:block;cursor:grab;touch-action:none}
svg#map.drag{cursor:grabbing}
.room{cursor:pointer}
.room path,.room polygon{transition:fill .15s}
.room:hover .f{fill:#e3eaf3}
.room.u .lbl{fill:#9aa3ad;font-weight:600}
.room.sel .f{fill:var(--acc)!important;stroke:var(--acc)!important}
.room.sel text{fill:#fff!important;stroke:none!important}
.lbl{font-size:12px;font-weight:700;fill:#2b3138;pointer-events:none;paint-order:stroke;stroke:#fff;stroke-width:3px;stroke-linejoin:round}
.lbl.s{font-size:10.5px}.lbl.b{font-size:14px;font-weight:800}
.zoom{position:absolute;right:20px;bottom:20px;display:flex;flex-direction:column;background:#fff;border:1px solid var(--line);border-radius:12px;overflow:hidden;z-index:3}
.zoom button{border:0;background:#fff;width:42px;height:42px;font-size:20px;color:var(--ink)}
.zoom button+button{border-top:1px solid var(--line)}
.legend{position:absolute;left:28px;bottom:20px;display:flex;gap:16px;font-size:12px;color:var(--sub);background:#fff;border:1px solid var(--line);padding:10px 14px;border-radius:12px;z-index:3}
.legend span{display:flex;align-items:center;gap:6px}
/* panel */
.panel{border-left:1px solid var(--line);overflow:auto;background:#fff}
.empty{padding:34px 28px}
.empty h2{font-size:22px;font-weight:800;letter-spacing:-.6px}
.empty p{font-size:14px;color:var(--sub);margin-top:8px;line-height:1.7}
.sec{margin-top:26px}
.sec h4{font-size:12px;letter-spacing:1.5px;color:var(--mute);font-weight:700;margin-bottom:10px}
.list button{display:flex;justify-content:space-between;align-items:center;width:100%;border:0;border-bottom:1px solid #f0f2f4;background:none;padding:12px 2px;text-align:left;font-size:14px}
.list button:hover{color:var(--acc2)}
.list em{font-style:normal;font-size:12px;color:var(--mute)}
.detail{padding:30px 28px 40px}
.crumb{display:flex;gap:6px;align-items:center;font-size:13px;color:var(--sub)}
.crumb .pill{background:var(--acc);color:#fff;border-radius:6px;padding:3px 8px;font-weight:800;font-size:12px}
.detail h1{font-size:30px;font-weight:800;letter-spacing:-1.2px;margin:12px 0 4px;line-height:1.25}
.detail .cat{font-size:13px;color:var(--sub)}
.detail .desc{font-size:15px;line-height:1.75;color:#3a424b;margin-top:18px}
table{width:100%;border-collapse:collapse;font-size:14px}
td{padding:11px 0;border-bottom:1px solid #f0f2f4;vertical-align:top}
td:first-child{font-weight:700;width:46%;padding-right:10px}
td:last-child{color:#4a535d}
.close{float:right;border:0;background:var(--bg);width:34px;height:34px;border-radius:50%;font-size:18px;color:var(--sub)}
.note{font-size:12px;color:var(--mute);margin-top:22px;line-height:1.6}
/* 태블릿 */
@media (max-width:1099px){.app{grid-template-columns:1fr 300px}header{gap:16px;padding:14px 18px}.brand b{font-size:17px}.search{width:240px}.floors button{min-width:50px;height:38px;font-size:14px}.ftitle{left:20px;top:18px}.ftitle b{font-size:30px}.legend{left:18px;bottom:16px;gap:10px;padding:8px 10px}.detail,.empty{padding:24px 20px}.detail h1{font-size:25px}}
@media (max-width:860px){.brand{display:none}.legend{display:none}}
/* 휴대폰 */
@media (max-width:699px){.app{grid-template-columns:1fr;grid-template-rows:auto minmax(280px,1fr) 42%;min-height:0}header{flex-wrap:wrap;gap:10px;padding:12px 12px}.floors{width:100%}.floors button{flex:1;min-width:0}.search{width:100%;margin-left:0}.search input{height:40px;font-size:14px}.search svg{top:11px}.results{top:46px}.panel{border-left:0;border-top:1px solid var(--line)}.ftitle{left:14px;top:12px}.ftitle b{font-size:24px}.ftitle span{font-size:12px}.zoom{right:12px;bottom:12px}.zoom button{width:38px;height:38px}.detail,.empty{padding:20px 16px 28px}.detail h1{font-size:23px}.empty h2{font-size:19px}}

.editbar{position:sticky;bottom:0;margin:18px -4px 0;padding:12px;background:#fff8e6;border:1px solid #f0d58a;border-radius:10px;font-size:12.5px;color:#6b5414}
.editbar b{color:#3d2f05}.editbar .row{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
.editbar button,.ef button{border:0;border-radius:8px;padding:8px 11px;font:inherit;font-size:12.5px;font-weight:700;cursor:pointer;background:#1F2F46;color:#fff}
.editbar button.ghost,.ef button.ghost{background:#e9edf2;color:#33404e}
.editbar textarea{width:100%;height:90px;margin-top:8px;font-size:11px;font-family:monospace;border:1px solid #e3d29c;border-radius:6px}
.ef{display:grid;gap:10px;margin-top:14px}
.ef label{font-size:12px;font-weight:700;color:#5f6b78;display:grid;gap:4px}
.ef label{min-width:0}.ef input,.ef textarea,.ef select{width:100%;box-sizing:border-box;font:inherit;font-size:14px;padding:9px 10px;border:1px solid #cfd6de;border-radius:8px;background:#fff;color:#1d2733}
.ef textarea{min-height:110px;resize:vertical}
.ef .row{display:flex;gap:6px}
.edittag{display:inline-block;margin-left:6px;padding:2px 7px;border-radius:99px;background:#f5b400;color:#3d2f05;font-size:11px;font-weight:800;vertical-align:middle}
</style>

function renderPanel(){const p=document.getElementById('panel');
 if(!sel){const list=sameFloorList();const ws=Object.keys(WORSHIP);
  p.innerHTML=`<div class="empty"><h2>${fobj(cur).name} 시설</h2><p>지도에서 공간을 누르거나 위에서 검색하면 공간 설명과 예배 안내를 볼 수 있어요.</p>

  <h1>${sel.nm}</h1><div class="cat">${CATN[sel.cat]||''}</div><p class="desc">${desc}</p>

   d.insertAdjacentHTML('beforeend',`<div class="ef"><div class="row"><label style="width:96px">실 번호<input id="eNum" value="${esc(o.num??v.num)}" placeholder="예: 227"></label><label style="flex:1">이름<input id="eName" value="${esc(o.name??v.name)}"></label></div>
